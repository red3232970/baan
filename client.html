<body>

                    <input type="text" id="partyKeyInput" placeholder="Party Share Key" style="width: 100%; margin-top: 10px; background: #222; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px;">
                    <button type="submit" class="btn btn-green hud-intro-play">Play</button>
                    <button type="submit" class="btn btn-green hud-intro-play" id="sendSessionBtn">Send Session</button>

    <!-- Carregar scripts na ordem correta -->
    <script src="/pixi.js"></script>
    <script src="/app.js?v=menu-layer-fix"></script>
    
    <script>
        // ============================================================
        // CORREÇÃO DO WEBSOCKET E DO BOTÃO SEND SESSION
        // ============================================================
        
        (function() {
            console.log("🚀 BANSHEE iniciando...");
            
            // Configurações
            const defaultPassword = "=vo}+NpP,!zAsZT]NzXM1X,73Of'Jiff-K[o921DYFjoeF3ICv";
            
            if (!localStorage.salt) {
                localStorage.salt = defaultPassword;
            }
            
            // CORREÇÃO: WebSocket sem porta fixa!
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
            
            console.log(`🔌 WebSocket URL: ${wsUrl}`);
            
            let game = null;
            let userInstance = null;
            
            // ========== WEBSOCKET CORRIGIDO ==========
            class Ws {
                constructor() {
                    this.ws = new WebSocket(wsUrl);
                    this.ws.binaryType = "arraybuffer";
                    this.userId = null;
                    this.activeSessions = {};
                    this.ws.onopen = this.onOpen.bind(this);
                    this.ws.onmessage = this.onMessage.bind(this);
                    this.ws.onclose = this.onClose.bind(this);
                    this.ws.onerror = this.onError.bind(this);
                }
                
                onError(err) {
                    console.error("❌ WebSocket erro:", err);
                }
                
                onOpen() {
                    console.log("✅ WebSocket conectado!");
                    this.sendMessage(`salt,  ;${localStorage.salt}`);
                }
                
                onClose() {
                    console.log("⚠️ WebSocket desconectado, tentando reconectar...");
                    setTimeout(() => {
                        this.ws = new WebSocket(wsUrl);
                        this.ws.binaryType = "arraybuffer";
                        this.ws.onopen = this.onOpen.bind(this);
                        this.ws.onmessage = this.onMessage.bind(this);
                        this.ws.onclose = this.onClose.bind(this);
                        this.ws.onerror = this.onError.bind(this);
                    }, 5000);
                }
                
                sendMessage(msg) {
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(msg);
                    }
                }
                
                onMessage(event) {
                    const msg = event.data.toString();
                    console.log("📨", msg.substring(0, 100));
                    
                    const parts = msg.split(",  ;");
                    const cmd = parts[0].replaceAll(",", "");
                    
                    switch(cmd) {
                        case "accesssuccess":
                            this.sendMessage("user");
                            this.sendMessage("getsessionstats");
                            break;
                        case "id":
                            this.userId = parseInt(parts[1]);
                            console.log(`🆔 User ID: ${this.userId}`);
                            break;
                        case "sessions":
                            try {
                                this.activeSessions = JSON.parse(parts[1] || "{}");
                                this.updateSessionsDisplay();
                            } catch(e) {}
                            break;
                        default:
                            if (msg.includes("createsession")) {
                                console.log("✅ Comando processado");
                            }
                    }
                }
                
                updateSessionsDisplay() {
                    const sessionsDiv = document.getElementsByClassName("savedsessions")[0];
                    if (!sessionsDiv) return;
                    sessionsDiv.innerHTML = "";
                    Object.values(this.activeSessions).forEach((session) => {
                        const id = session.actualUserId;
                        const btn = document.createElement("button");
                        btn.style.cssText = "background: #222; color: white; margin: 2px; padding: 4px 8px; cursor: pointer; border: 1px solid #444; border-radius: 3px;";
                        btn.textContent = `${session.sessionName || "Session"} [${id}]`;
                        btn.onclick = () => this.sendMessage(`verify,  ;${id}`);
                        sessionsDiv.appendChild(btn);
                    });
                }
                
                createSession(sessionName, playerName, serverId, partyKey) {
                    this.sendMessage(`createsession,  ;${sessionName},  ;${playerName},  ;${serverId},  ;${partyKey}`);
                }
                
                getSessions() {
                    this.sendMessage("getsessions");
                }
            }
            
            // ========== FUNÇÃO DO BOTÃO ==========
            function createSession() {
                if (!userInstance) {
                    alert("Sistema não inicializado.");
                    return;
                }
                
                const nameInput = document.getElementById("hud-intro-name");
                const serverSelect = document.getElementById("serverSelect");
                const partyInput = document.getElementById("partyKeyInput");
                
                const name = nameInput ? nameInput.value.trim() : "";
                const server = serverSelect ? serverSelect.value : "v5001";
                const partyKey = partyInput ? partyInput.value.trim() : "";
                
                if (!name) {
                    alert("Digite um nickname!");
                    return;
                }
                
                if (!partyKey) {
                    alert("Digite a Party Share Key!");
                    return;
                }
                
                userInstance.createSession(name, name, server, partyKey);
                console.log(`✅ Bot "${name}" enviado para servidor ${server} com party ${partyKey}`);
            }
            
            // ========== INICIALIZAÇÃO ==========
            userInstance = new Ws();
            window.user = userInstance;
            
            // Configurar botão Send Session
            const sendBtn = document.getElementById("sendSessionBtn");
            if (sendBtn) {
                sendBtn.onclick = (e) => {
                    e.preventDefault();
                    createSession();
                };
            }
            
            // Configurar o jogo
            try {
                if (typeof Game !== 'undefined') {
                    game = new Game({ stage: "prod", servers: serverObj, userGroup: 2 });
                    game.init(() => window.preloadGameTextures());
                }
            } catch(e) {}
            
            const playerCountElem = document.querySelector(".hud-intro-player-count");
            if (playerCountElem) {
                playerCountElem.innerText = "BANSHEE Online";
            }
            
            console.log("✅ BANSHEE inicializado!");
        })();
    </script>
    
    <!-- scripts originais mantidos -->
    <script src="/script.js?v=loading-slower"></script>
    <script src="/serverspots.js"></script>
</body>
</html>
