<!DOCTYPE html>
<html lang="en">
<head>
    <title>BANSHEE</title>
    <link rel="icon" type="image/x-icon" href="/images/icons/favicon.ico">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Hammersmith+One:400">
    <link rel="stylesheet" href="/app.css?v=menu-layer-fix">
</head>
<body>
    <div id="banshee-session-loader" class="banshee-session-loader" aria-hidden="true">
        <div class="banshee-session-logo">𝕭𝖆𝖓𝖘𝖍𝖊𝖊</div>
    </div>
    <div id="hud-intro" class="hud-intro">
        <div class="hud-intro-wrapper">
            <h1>𝕭𝖆𝖓𝖘𝖍𝖊𝖊</h1>
            <div class="hud-intro-credits" aria-label="Credits">
                <span class="hud-intro-credit"><span>Creator</span> L✡L✡L ヅ✓</span>
                <span class="hud-intro-credit"><span>Designer</span> Sirr0m</span>
            </div>
            <h2 class="hud-intro-player-count">Loading...</h2>
            <div class="hud-intro-main">
                <div class="hud-intro-left">
                    <div class="session_saver"></div>
                </div>
                <div class="hud-intro-form">
                    <input type="text" name="nickname" class="hud-intro-name" id="hud-intro-name" maxlength="29" placeholder="Your nickname...">
                    <select class="hud-intro-server" name="server" id="serverSelect">
                        <optgroup label="US East">
                            <option value="v1001">US East #1 - v1001</option>
                            <option value="v1002">US East #2 - v1002</option>
                            <option value="v1003">US East #3 - v1003</option>
                            <option value="v1004">US East #4 - v1004</option>
                            <option value="v1005">US East #5 - v1005</option>
                            <option value="v1006">US East #6 - v1006</option>
                            <option value="v1007">US East #7 - v1007</option>
                            <option value="v1008">US East #8 - v1008</option>
                        </optgroup>
                        <optgroup label="US West">
                            <option value="v2001">US West #1 - v2001</option>
                            <option value="v2002">US West #2 - v2002</option>
                            <option value="v2003">US West #3 - v2003</option>
                        </optgroup>
                        <optgroup label="Europe">
                            <option value="v5001" selected>Europe #1 - v5001</option>
                            <option value="v5002">Europe #2 - v5002</option>
                            <option value="v5003">Europe #3 - v5003</option>
                            <option value="v5004">Europe #4 - v5004</option>
                            <option value="v5005">Europe #5 - v5005</option>
                            <option value="v5006">Europe #6 - v5006</option>
                            <option value="v5007">Europe #7 - v5007</option>
                        </optgroup>
                        <optgroup label="Asia">
                            <option value="v3001">Asia #1 - v3001</option>
                        </optgroup>
                        <optgroup label="Australia">
                            <option value="v4001">Australia #1 - v4001</option>
                            <option value="v4002">Australia #2 - v4002</option>
                        </optgroup>
                    </select>
                    <button type="submit" class="btn btn-green hud-intro-play" id="playBtn">Play</button>
                    <button type="submit" class="btn btn-green hud-intro-play" id="sendSessionBtn">Send Session</button>
                    <span class="hud-intro-error"></span>
                    <label for="hud-intro-disable-loading">
                        <input type="checkbox" id="hud-intro-disable-loading" name="disableLoadingScreen" class="hud-intro-canvas" value="true">
                        <span>Disable Loading Screen</span>
                    </label>
                </div>
                <div class="hud-intro-guide"></div>
            </div>
        </div>
    </div>

    <!-- Carregar scripts na ordem correta APENAS UMA VEZ -->
    <script src="/pixi.js"></script>
    <script src="/app.js?v=menu-layer-fix"></script>
    
    <script>
        // ============================================================
        // BANSHEE - VERSÃO CORRIGIDA
        // WebSocket na porta correta (usando /ws, sem porta separada)
        // ============================================================
        
        (function() {
            console.log("🚀 BANSHEE iniciando...");
            
            // Configurações
            const defaultPassword = "=vo}+NpP,!zAsZT]NzXM1X,73Of'Jiff-K[o921DYFjoeF3ICv";
            const WS_PATH = "/ws";
            
            if (!localStorage.salt) {
                localStorage.salt = defaultPassword;
            }
            
            // WebSocket CORRETO (usando o mesmo host, path /ws)
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}${WS_PATH}`;
            console.log(`🔌 Conectando WebSocket em: ${wsUrl}`);
            
            let game = null;
            let userInstance = null;
            
            class Ws {
                constructor() {
                    this.ws = new WebSocket(wsUrl);
                    this.ws.binaryType = "arraybuffer";
                    this.userId = null;
                    this.activeSessions = {};
                    this.ws.onopen = this.onOpen.bind(this);
                    this.ws.onmessage = this.onMessage.bind(this);
                    this.ws.onclose = this.onClose.bind(this);
                    this.ws.onerror = this.onError.bind(this);
                }
                
                onError(err) {
                    console.error("❌ WebSocket erro:", err);
                }
                
                onOpen() {
                    console.log("✅ WebSocket conectado!");
                    this.sendMessage(`salt,  ;${localStorage.salt}`);
                }
                
                onClose() {
                    console.log("⚠️ WebSocket desconectado, tentando reconectar em 5s...");
                    setTimeout(() => {
                        console.log("🔄 Reconectando WebSocket...");
                        this.ws = new WebSocket(wsUrl);
                        this.ws.binaryType = "arraybuffer";
                        this.ws.onopen = this.onOpen.bind(this);
                        this.ws.onmessage = this.onMessage.bind(this);
                        this.ws.onclose = this.onClose.bind(this);
                        this.ws.onerror = this.onError.bind(this);
                    }, 5000);
                }
                
                sendMessage(msg) {
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(msg);
                    } else {
                        console.warn("⚠️ WebSocket não está aberto");
                    }
                }
                
                onMessage(event) {
                    const msg = event.data.toString();
                    console.log("📨 Recebido:", msg.substring(0, 100));
                    
                    const parts = msg.split(",  ;");
                    const cmd = parts[0].replaceAll(",", "");
                    
                    switch(cmd) {
                        case "accesssuccess":
                            this.sendMessage("user");
                            this.sendMessage("getsessionstats");
                            break;
                        case "id":
                            this.userId = parseInt(parts[1]);
                            console.log(`🆔 User ID: ${this.userId}`);
                            break;
                        case "sessions":
                            try {
                                this.activeSessions = JSON.parse(parts[1] || "{}");
                                console.log(`📋 Sessões ativas: ${Object.keys(this.activeSessions).length}`);
                                this.updateSessionsDisplay();
                            } catch(e) {
                                console.error("Erro ao parsear sessões:", e);
                            }
                            break;
                        default:
                            if (msg.includes("createsession")) {
                                console.log("✅ Comando processado");
                            }
                    }
                }
                
                updateSessionsDisplay() {
                    const sessionsDiv = document.getElementsByClassName("savedsessions")[0];
                    if (!sessionsDiv) return;
                    
                    sessionsDiv.innerHTML = "";
                    Object.values(this.activeSessions).forEach((session) => {
                        const id = session.actualUserId;
                        const btn = document.createElement("button");
                        btn.style.cssText = "background: #222; color: white; font-family: Hammersmith One, sans-serif; margin: 2px; padding: 4px 8px; cursor: pointer; border: 1px solid #444; border-radius: 3px;";
                        btn.textContent = `${session.sessionName || "Session"} [${id}]`;
                        btn.onclick = () => {
                            console.log(`🔍 Verificando sessão ${id}`);
                            this.sendMessage(`verify,  ;${id}`);
                        };
                        sessionsDiv.appendChild(btn);
                    });
                }
                
                createSession(sessionName, playerName, serverId, partyKey) {
                    console.log(`🎮 Criando sessão: ${playerName} no servidor ${serverId}${partyKey ? ` com party ${partyKey}` : ""}`);
                    this.sendMessage(`createsession,  ;${sessionName},  ;${playerName},  ;${serverId},  ;${partyKey}`);
                }
                
                getSessions() {
                    this.sendMessage("getsessions");
                }
            }
            
            function createSession() {
                if (!userInstance) {
                    alert("❌ Sistema não inicializado.");
                    return;
                }
                
                const nameInput = document.getElementById("hud-intro-name");
                const serverSelect = document.getElementById("serverSelect");
                const partyInput = document.getElementById("partyKeyInput");
                const name = nameInput ? nameInput.value.trim() : "Bot";
                const server = serverSelect ? serverSelect.value : "v5006";
                const partyKey = partyInput ? partyInput.value.trim() : "";
                
                if (!name || name.length < 2) {
                    alert("❌ Digite um nickname válido (mínimo 2 caracteres)");
                    return;
                }

                if (!partyKey) {
                    alert("❌ Digite a Party Share Key!");
                    return;
                }
                
                userInstance.createSession(name, name, server, partyKey);
                console.log(`✅ Bot "${name}" enviado para servidor ${server}`);
            }
            
            // Inicializar
            userInstance = new Ws();
            window.user = userInstance;
            
            // Configurar botão Send Session
            const sendBtn = document.getElementById("sendSessionBtn");
            if (sendBtn) {
                sendBtn.onclick = (e) => {
                    e.preventDefault();
                    createSession();
                };
            }
            
            // Configurar Session Saver
            const sessionDiv = document.querySelector(".session_saver");
            if (sessionDiv) {
                sessionDiv.innerHTML = `
                    <h3>📋 Session Saver</h3>
                    <hr>
                    <div style="font-size: 12px; color: #aaa;">
                        <p>✅ Bots conectados via WebSocket</p>
                        <p>🔗 As sessões são salvas no servidor</p>
                        <button id="refreshSessionsBtn" style="background: #333; color: white; border: 1px solid #555; padding: 4px 8px; margin-top: 8px; cursor: pointer;">🔄 Atualizar Sessões</button>
                    </div>
                    <div class="savedsessions" style="margin-top: 10px;"></div>
                `;
                
                const refreshBtn = document.getElementById("refreshSessionsBtn");
                if (refreshBtn) {
                    refreshBtn.onclick = () => {
                        if (userInstance) userInstance.getSessions();
                    };
                }
            }
            
            // Aguardar o game ser carregado para configurar o script.js
            console.log("🔄 Aguardando inicialização do jogo...");
            
            function loadAdditionalScripts() {
                if (typeof game !== 'undefined' && game && game.network) {
                    console.log("✅ Game detectado, carregando script.js...");
                    clearInterval(checkInterval);
                    
                    // Corrigir a URL do WebSocket no script.js
                    window.__BANSHEE_WS_URL__ = wsUrl;
                    
                    const script = document.createElement('script');
                    script.src = '/script.js?v=loading-slower';
                    script.onload = () => console.log("✅ script.js carregado");
                    script.onerror = () => console.error("❌ Erro ao carregar script.js");
                    document.body.appendChild(script);
                    return true;
                }
                return false;
            }
            
            const checkInterval = setInterval(() => {
                if (loadAdditionalScripts()) clearInterval(checkInterval);
            }, 100);
            
            setTimeout(() => {
                if (typeof game === 'undefined') {
                    console.warn("⚠️ Timeout: game não detectado");
                    clearInterval(checkInterval);
                }
            }, 10000);
            
            const playerCountElem = document.querySelector(".hud-intro-player-count");
            if (playerCountElem) {
                playerCountElem.innerText = "🟢 BANSHEE Online";
            }
            
            console.log("✅ BANSHEE inicializado!");
            console.log(`🔌 WebSocket URL: ${wsUrl}`);
        })();
    </script>
    <!-- script.js será carregado dinamicamente quando game estiver pronto -->
</body>
</html>
